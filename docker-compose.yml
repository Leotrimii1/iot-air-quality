services:
  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_network

  cassandra:
    image: cassandra:3.11
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=AirQualityCluster
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q 'UN'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - iot_network

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - iot_network

  simulator:
    build:
      context: .
      dockerfile: docker/simulator/Dockerfile
    depends_on:
      - mqtt
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - iot_network

  consumer:
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    depends_on:
      mqtt:
        condition: service_started
      cassandra:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - iot_network

volumes:
  mosquitto_data:
  mosquitto_log:
  cassandra_data:
  grafana_data:

networks:
  iot_network:
    driver: bridge