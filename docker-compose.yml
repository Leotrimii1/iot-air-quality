services:
  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_network

  cassandra:
    image: cassandra:3.11
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=AirQualityCluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q 'UN'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - iot_network

  kafka:
    image: apache/kafka:3.7.0 
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - iot_network

  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - iot_network

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - iot_network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=hadesarchitect-cassandra-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - iot_network

  simulator:
    build:
      context: .
      dockerfile: docker/simulator/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_BROKER=mqtt
      - MQTT_TOPIC=air-quality/sensor1
      - DATASET_PATH=/app/prishtina_pm1_pm2.5.csv
      - SIMULATOR_SLEEP_SECONDS=1
    depends_on:
      - mqtt
    networks:
      - iot_network

  bridge:
    build:
      context: .
      dockerfile: docker/bridge/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=kafka:9092
      - MQTT_BROKER=mqtt
      - MQTT_TOPIC=air-quality/sensor1
      - KAFKA_TOPIC=air-quality
    depends_on:
      - mqtt
      - kafka
    networks:
      - iot_network

  processor:
    build:
      context: .
      dockerfile: docker/processor/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=air-quality
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_KEYSPACE=air_quality
      - CASSANDRA_TABLE=air_quality
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
      spark-master:
        condition: service_started
    networks:
      - iot_network

volumes:
  mosquitto_data:
  mosquitto_log:
  cassandra_data:
  grafana_data:
  kafka_data:

networks:
  iot_network:
    driver: bridge
